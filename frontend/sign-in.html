<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to LaunchPad Reading Application to save your progress and access personalized features.">
  <title>Sign In — LaunchPad Reading Application</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="wrapper">
    <div class="container">
      <header class="top">
        <h1>LaunchPad Reading Application</h1>
        <nav class="top-nav" aria-label="Main navigation">
          <a href="index.html">Reading Level Quiz</a>
          <a href="reading-resources.html">Reading Resources</a>
          <a href="accessibility.html">Accessibility</a>
          <a href="learning-strategies.html">Learning Strategies</a>
          <button id="filterBtn" class="filter-btn" type="button" aria-pressed="false" aria-label="Toggle yellow reading filter for dyslexia support">Filter</button>
        </nav>
      </header>

      <main class="main-content" id="main-content">
        <h2>Sign In (placeholder)</h2>
        <p>This is a placeholder page for the sign-in flow. Integration with authentication can be added later.</p>
      </main>

      <footer class="small-footer" role="contentinfo">
        <a class="small-link" href="index.html">Back to Home</a>
      </footer>
    </div>
  </div>
  <div id="reading-filter-overlay" role="presentation" aria-hidden="true"></div>
  <script>
    (function () {
      var overlay = document.getElementById('reading-filter-overlay');
      var btn = document.getElementById('filterBtn');
      var KEY = 'rlt-reading-filter';
      function apply(on) {
        if (on) { overlay.classList.add('active'); btn.classList.add('active'); btn.setAttribute('aria-pressed', 'true'); }
        else { overlay.classList.remove('active'); btn.classList.remove('active'); btn.setAttribute('aria-pressed', 'false'); }
      }
      apply(localStorage.getItem(KEY) === '1');
      btn.addEventListener('click', function () {
        var next = localStorage.getItem(KEY) !== '1';
        localStorage.setItem(KEY, next ? '1' : '0');
        apply(next);
      });
    }());
  </script>
</body>
</html>
