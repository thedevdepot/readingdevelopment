<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Missing Word Quiz</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container">
    <header class="top">
      <h1>Missing Word Quiz</h1>
      <nav class="top-menu">
        <a href="https://www.biblegateway.com/" target="_blank" rel="noopener">Bible Gateway</a>
        <a href="https://www.gutenberg.org" target="_blank" rel="noopener">Project Gutenberg</a>
        <a href="https://archive.org/" target="_blank" rel="noopener">Archive.org</a>
        <a href="https://www.poetryfoundation.org" target="_blank" rel="noopener">Poetry Foundation</a>
        <a href="https://www.overdrive.com/apps/libby/" target="_blank" rel="noopener">Libby</a>
      </nav>
    </header>

    <p class="desc">Try this experimental sentence completion activity. Select your grade to load three questions for your current level.</p>

    <div id="gradeSelect" class="grade-select">
      <label for="grade">Choose your grade:</label>
      <select id="grade">
        <option value="1">Grade 1</option>
        <option value="2">Grade 2</option>
        <option value="3">Grade 3</option>
        <option value="4">Grade 4</option>
        <option value="5">Grade 5</option>
        <option value="6">Grade 6</option>
      </select>
      <button id="startBtn">Start Quiz</button>
    </div>

    <p id="progress"></p>
    <div id="sentenceContainer" class="sentence-container hidden"></div>

    <div id="choices" class="choice-row hidden"></div>

    <div id="feedback" class="hidden"></div>

    <button id="nextBtn" class="hidden">Submit Answer</button>
    <button id="restartBtn" class="secondary hidden">Restart</button>

    <div id="result" class="hidden"></div>

    <footer class="small-footer">
      <a class="small-link" href="https://github.com/thedevdepot/readingdevelopment" target="_blank" rel="noopener">View on GitHub</a>
    </footer>
  </div>

  <script src="missing-word.js"></script>
</body>

</html>
