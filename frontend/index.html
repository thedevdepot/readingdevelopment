<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Reading Level Quiz</title>
	<link rel="stylesheet" href="styles.css">
</head>

<body>

	<div class="container">
		<header class="top">
			<h1>Reading Level Quiz</h1>
			<nav class="top-menu">
				<a href="https://www.gutenberg.org" target="_blank" rel="noopener">Project Gutenberg</a>
				<a href="https://www.overdrive.com/apps/libby/" target="_blank" rel="noopener">Libby</a>
				<a href="https://github.com/thedevdepot/readingdevelopment" target="_blank" rel="noopener">My GitHub</a>
				<a href="https://www.poetryfoundation.org" target="_blank" rel="noopener">Poetry Foundation</a>
			</nav>
		</header>

		<p class="desc">This short quiz estimates a student's reading level between Grade 1 and Grade 6. The app will not place anyone above 6th grade.</p>

		<p id="progress"></p>
		<p id="question"></p>

		<div id="choices"></div>

		<div id="feedback" class="hidden"></div>

		<button id="nextBtn">Submit Answer</button>
		<button id="restartBtn" class="secondary">Start Over</button>

		<div id="result" class="hidden"></div>

		<footer class="small-footer">
			<a class="small-link" href="https://github.com/thedevdepot/readingdevelopment" target="_blank" rel="noopener">View on GitHub</a>
		</footer>
	</div>

	<script src="script.js"></script>
</body>

</html>
